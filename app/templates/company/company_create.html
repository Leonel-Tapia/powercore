<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        h2 { margin: 0; }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-actions button {
            padding: 6px 14px;
            cursor: pointer;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 3px;
        }

        .top-actions button[type="button"] {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
        }

        .top-actions button:hover {
            opacity: 0.9;
        }

        .top-link {
            text-decoration: none;
            font-size: 14px;
            color: #0077cc;
            margin-left: 12px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        select {
            background-color: #fff;
            height: 30px;
        }
    </style>

    <script>
        function formatPhone(input) {
            let value = input.value.replace(/\D/g, "");
            if (value.length > 10) value = value.slice(0, 10);

            if (value.length >= 6) {
                input.value = `(${value.slice(0,3)}) ${value.slice(3,6)}-${value.slice(6)}`;
            } else if (value.length >= 3) {
                input.value = `(${value.slice(0,3)}) ${value.slice(3)}`;
            } else {
                input.value = value;
            }
        }

        function confirmCancel() {
            const isConfirmed = confirm("¿Está seguro que desea cancelar? Se borrará toda la información ingresada.");
            
            if (isConfirmed) {
                const form = document.getElementById("companyForm");
                const elements = form.elements;

                for (let i = 0; i < elements.length; i++) {
                    const field = elements[i];
                    if (field.type === "text" || field.type === "email" || field.tagName === "TEXTAREA") {
                        field.value = "";
                    } else if (field.type === "number") {
                        field.value = "0.00";
                    } else if (field.tagName === "SELECT") {
                        field.selectedIndex = 0;
                    } else if (field.type === "checkbox") {
                        field.checked = true;
                    }
                }
            }
        }

        function updateButtonLabel() {
            const mode = "{{mode}}";
            const btn = document.getElementById("btnSubmitTop");
            btn.textContent = mode === "edit" ? "Save" : "Create";
        }

        function formatInitialPhones() {
            const phoneFields = ["main_phone", "contact_phone"];
            phoneFields.forEach(id => {
                const field = document.getElementsByName(id)[0];
                if (field && field.value.trim() !== "") {
                    formatPhone(field);
                }
            });
        }

        window.onload = function() {
            updateButtonLabel();
            formatInitialPhones();
        };
    </script>
</head>

<body>
