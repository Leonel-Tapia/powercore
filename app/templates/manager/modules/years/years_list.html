<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Years – PowerCore</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        .header {
            background: #005a9e;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .wrapper {
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .add-btn {
            padding: 6px 14px;
            background: #0078D4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .add-btn:hover { background: #005A9E; }

        .add-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .back-btn {
            padding: 6px 14px;
            background: #444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .back-btn:hover { background: #222; }

        .next-year-msg {
            text-align: right;
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
        }

        .limit-msg {
            text-align: right;
            font-size: 13px;
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #e8eef7;
            font-weight: bold;
        }
    </style>

    <script>
        let creating = false;
        function autoCreateYear() {
            if (creating) return;
            creating = true;
            document.getElementById("autoCreateForm").submit();
        }
    </script>
</head>

<body>

<div class="header">Years</div>

<div class="wrapper">

    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='/manager/windshield_menu'">Return</button>
        
        <!-- Botón condicional según el límite -->
        {% if disable_add %}
            <button class="add-btn" disabled>Add Next Year</button>
        {% else %}
            <button class="add-btn" onclick="autoCreateYear()">Add Next Year</button>
        {% endif %}
    </div>

    <!-- Mensaje dinámico de estado o advertencia de límite -->
    {% if disable_add %}
        <div class="limit-msg">
            Límite alcanzado: Máximo permitido hasta el año {{ max_allowed_year }}
        </div>
    {% else %}
        <div class="next-year-msg">
            Next year to be created: <strong>{{ next_year }}</strong>
        </div>
    {% endif %}

    <form id="autoCreateForm" method="post" action="/manager/years/add"></form>

    <table>
        <tr>
            <th>ID</th>
            <th>Year</th>
        </tr>
        {% for y in years %}
        <tr>
            <td>{{ y.id }}</td>
            <td>{{ y.year }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
