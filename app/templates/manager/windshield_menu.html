<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PowerCore – Windshield Manager</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbe3ef, #f4f6fa);
        }

        .header {
            background: #005a9e;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }

        .wrapper {
            width: 90%;
            max-width: 360px;
            margin: 40px auto;
            text-align: center;
        }

        .menu-btn {
            width: 100%;
            padding: 12px 0;
            margin-bottom: 12px;
            background: #0078D4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        .menu-btn:hover {
            background: #005A9E;
            transform: translateY(-2px);
        }

        .back-btn {
            padding: 8px 20px;
            background: #444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #222;
        }

        .back-container {
            text-align: right;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="header">Windshield Manager</div>

<div class="wrapper">

    <button class="menu-btn" onclick="window.location.href='/manager/years/list'">Years</button>

    <button class="menu-btn" onclick="window.location.href='/manager/makesmodels/list'">Make & Models</button>

    <button class="menu-btn" onclick="window.location.href='/inventory/windshield/manage'">Windshields Catalog</button>
    
    <button class="menu-btn" onclick="alert('This section is currently in development...');">Vendor Prices</button>
    
    <div class="back-container">
        <button class="back-btn" onclick="window.location.href='/manager/menu'">Return</button>
    </div>

</div>

</body>
</html>
