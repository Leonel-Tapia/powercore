<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PowerCore – Manager Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef1f5;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0078D4;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            margin: 40px auto;
            width: 90%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.12);
            text-align: center;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 14px rgba(0,0,0,0.18);
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: #333;
        }

        .card-btn {
            padding: 10px 18px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .card-btn:hover {
            background-color: #005A9E;
        }

        .card-btn-green {
            background-color: #28a745;
        }

        .card-btn-green:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

<div class="header">
    Manager Menu
</div>

<div class="container">

    <div class="card">
        <div class="card-title">Users</div>
        <button class="card-btn" onclick="window.location.href='/users/list'">Open</button>
    </div>

    <div class="card">
        <div class="card-title">Inventory Parts</div>
        <button class="card-btn" onclick="window.location.href='/inventory/view/catalogo'">Open</button>
    </div>

    <div class="card">
        <div class="card-title">Company</div>
        <button class="card-btn" onclick="window.location.href='/company/create'">Open</button>
    </div>

    <div class="card">
        <div class="card-title">Permissions</div>
        <button class="card-btn">Open</button>
    </div>

    <div class="card">
        <div class="card-title">Windshield</div>
        <button class="card-btn" onclick="window.location.href='/manager/windshield_menu'">Open</button>
    </div>

    <!-- ⭐ NUEVO BOTÓN: ACTIVITY CONCEPTS ⭐ -->
    <div class="card">
        <div class="card-title">Activity Concepts</div>
        <button class="card-btn card-btn-green" onclick="window.location.href='/manager/activities_concepts'">Open</button>
    </div>

    <div class="card">
        <div class="card-title">Back</div>
        <button class="card-btn" onclick="window.location.href='/company/main_menu'">Return</button>
    </div>

</div>

</body>
</html>
