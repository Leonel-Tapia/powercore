<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Call Center & Management Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
            margin: 0;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: nowrap;
            max-width: 1350px;
            margin: auto;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
            text-align: center;
        }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a.button {
            display: block;
            padding: 12px;
            background: #007bff;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        a.button:hover {
            background: #0056b3;
        }
        .placeholder-text {
            color: #6c757d;
            font-style: italic;
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
        }
        /* Botón flotante general en la esquina inferior derecha */
        .floating-logout {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        .floating-logout:hover {
            background: #a71d2a;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 1. Call Center Module -->
        <div class="container">
            <h2>Call Center Module</h2>
            <div class="menu-links">
                <a href="/call_center/search" class="button">Customer Search</a>
            </div>
        </div>

        <!-- 2. Estimates Control -->
        <div class="container">
            <h2>Estimates Control</h2>
            <div class="menu-links">
                <!-- Enlace actualizado a la ruta del backend del Call Center -->
                <a href="/call_center/daily_estimates" class="button">Daily Appointments Pending Confirmation</a>
                <!-- Future estimate buttons will go here -->
            </div>
        </div>

        <!-- 3. Invoices Control -->
        <div class="container">
            <h2>Invoices Control</h2>
            <div class="menu-links">
                <a href="/invoices/workshop" class="button">Invoices / Workshop</a>
            </div>
        </div>
    </div>

    <!-- General Floating Sign Out Button -->
    <a href="/call_center/logout" class="floating-logout">Sign Out</a>
</body>
</html>
