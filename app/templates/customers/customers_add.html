<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 95%;
            max-width: 1300px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-top: 3px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 3px 5px;
            margin-top: 2px;
            border-radius: 4px;
            border: 1px solid #ccc;
            height: 24px;
        }

        .notes-line {
            width: 100%;
            height: 26px;
            padding: 3px 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            resize: none;
            overflow: hidden;
            white-space: nowrap;
        }

        .full-width {
            grid-column: span 3;
        }

        .row-3-inline {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 6px;
        }

        .buttons-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .btn {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #0056b3;
            color: white;
        }

        .cancel-btn {
            background-color: #6c757d;
        }

        .cancel-btn:hover {
            background-color: #545b62;
        }

        .menu-btn {
            background-color: #17a2b8;
        }

        .menu-btn:hover {
            background-color: #117a8b;
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* MODAL BOX */
        .modal-box {
            background: white;
            width: 600px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.25);
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .modal-buttons {
            margin-top: 20px;
            text-align: right;
        }

        /* ZIP AUTOCOMPLETE */
        .autocomplete-list {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 6px 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Add Customer</h2>

        <form method="post" action="/customers/add">

            <!-- Campo oculto para conservar el origen del flujo (ej. call_center o manager) -->
            <input type="hidden" name="origin" value="{{ origin | default('manager') }}">

            <div class="grid-3">

                <!-- COLUMNA 1 -->
                <div>
                    <label>Name</label>
                    <input type="text" name="name" value="{{ name | default('') }}" required>

                    <label>Business Name</label>
                    <input type="text" name="business_name">

                    <label>Primary Contact Name</label>
                    <input type="text" name="contact_name">

                    <label>Primary Contact Phone</label>
                    <input type="text" name="contact_phone" oninput="formatPhone(this)">

                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ phone | default('') }}" oninput="formatPhone(this)">

                    <label>Phone 2</label>
                    <input type="text" name="phone2" oninput="formatPhone(this)">
                </div>

                <!-- COLUMNA 2 -->
                <div>
                    <label>Second Contact Name</label>
                    <input type="text" name="contact_name2">

                    <label>Second Contact Phone</label>
                    <input type="text" name="contact_phone2" oninput="formatPhone(this)">

                    <label>Email</label>
                    <input type="email" name="email">

                    <label>Tax ID</label>
                    <input type="text" name="tax_id">
                </div>

                <!-- COLUMNA 3 -->
                <div style="position: relative;">
                    <label>Address</label>
                    <input type="text" name="address">

                    <label>City</label>
                    <input type="text" id="city" name="city">

                    <label>State</label>
                    <input type="text" id="state" name="state">

                    <label>ZIP Code</label>
                    <input type="text" id="zip_code" name="zip_code" autocomplete="off">

                    <div id="zip_suggestions" class="autocomplete-list"></div>

                    <label>Language</label>
                    <select name="language">
                        <option value="ENGLISH">English</option>
                        <option value="SPANISH">Spanish</option>
                        <option value="MIXED">Mixed</option>
                    </select>
                </div>

                <!-- TYPE / MOOD / STATUS + INTERNAL NOTES -->
                <div class="full-width">
                    <div class="row-3-inline">
                        <div>
                            <label>Customer Type</label>
                            <select name="customer_type">
                                <option value="GENERAL">General</option>
                                <option value="RETAIL">Retail</option>
                                <option value="AUTO">Auto</option>
                                <option value="MONEYWIRE">Money Wire</option>
                            </select>
                        </div>

                        <div>
                            <label>Mood</label>
                            <select name="mood">
                                <option value="HAPPY">Happy</option>
                                <option value="QUIET">Quiet</option>
                                <option value="SAD">Sad</option>
                            </select>
                        </div>

                        <div>
                            <label>Status</label>
                            <select name="status">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <label style="margin-top: 8px;">Internal Notes</label>
                    <textarea class="notes-line" name="internal_notes"></textarea>
                </div>

            </div>

            <!-- BOTONES PRINCIPALES -->
            <div class="buttons-row">
                <button type="submit" class="btn">Save</button>
                <a href="{% if origin == 'call_center' %}/call_center/search{% else %}/customers/list{% endif %}" class="btn cancel-btn">Cancel</a>
                <a href="/company/main_menu" class="btn menu-btn">Menu</a>
                <button type="button" class="btn menu-btn" onclick="openAdditional()">Additional Information</button>
            </div>

            <!-- ADDITIONAL INFORMATION MODAL -->
            <div id="additionalModal" class="modal-overlay" style="display:none;">
                <div class="modal-box">

                    <h3>Additional Información del Cliente</h3>

                    <div class="modal-grid">

                        <div>
                            <label>Allow SMS</label>
                            <select name="allow_sms">
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>

                            <label>SMS Opt-Out Reason</label>
                            <input type="text" name="sms_opt_out_reason">

                            <label>Preferred Contact Method</label>
                            <select name="preferred_contact_method">
                                <option value="PHONE">Phone</option>
                                <option value="SMS">SMS</option>
                                <option value="EMAIL">Email</option>
                            </select>

                            <label>Preferred Contact</label>
                            <select name="preferred_contact">
                                <option value="PHONE">Phone</option>
                                <option value="SMS">SMS</option>
                                <option value="EMAIL">Email</option>
                            </select>

                            <label>Referral Source</label>
                            <input type="text" name="referral_source">

                            <label>Tags</label>
                            <input type="text" name="tags">
                        </div>

                        <div>
                            <label>Birthday</label>
                            <input type="date" name="birthday">

                            <label>Credit Limit</label>
                            <input type="number" step="0.01" name="credit_limit">

                            <label>Last Purchase Date</label>
                            <input type="date" name="last_purchase_date">

                            <label>Customer Rating</label>
                            <input type="number" min="1" max="10" name="customer_rating">

                            <label>Tax Exempt</label>
                            <select name="is_tax_exempt">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>

                            <label>Tax Exempt License</label>
                            <input type="text" name="tax_exempt_license">
                        </div>

                    </div>

                    <div class="modal-buttons">
                        <button type="button" class="btn cancel-btn" onclick="closeAdditional()">Close</button>
                    </div>

                </div>
            </div>

        </form>
    </div>

    <!-- PHONE FORMAT SCRIPT -->
    <script>
        function formatPhone(input) {
            let value = input.value.replace(/\D/g, "");

            if (value.length > 10) {
                value = value.slice(0, 10);
            }

            if (value.length >= 7) {
                input.value = `(${value.slice(0,3)}) ${value.slice(3,6)}-${value.slice(6)}`;
            } else if (value.length >= 4) {
                input.value = `(${value.slice(0,3)}) ${value.slice(3)}`;
            } else if (value.length >= 1) {
                input.value = `(${value}`;
            }
        }

        function openAdditional() {
            document.getElementById("additionalModal").style.display = "flex";
        }

        function closeAdditional() {
            document.getElementById("additionalModal").style.display = "none";
        }
    </script>

    <!-- ZIP AUTOCOMPLETE + VALIDATION -->
    <script>
        const zipInput = document.getElementById("zip_code");
        const cityInput = document.getElementById("city");
        const stateInput = document.getElementById("state");
        const suggestionsBox = document.getElementById("zip_suggestions");

        zipInput.addEventListener("input", async function () {
            const query = this.value.trim();

            if (query.length < 2) {
                suggestionsBox.style.display = "none";
                return;
            }

            const response = await fetch(`/zipcodes/search?q=${query}`);
            const data = await response.json();

            suggestionsBox.innerHTML = "";

            if (data.length === 0) {
                suggestionsBox.style.display = "none";
                return;
            }

            data.forEach(item => {
                const div = document.createElement("div");
                div.classList.add("autocomplete-item");
                div.textContent = `${item.zip_code} – ${item.city}, ${item.state}`;

                div.addEventListener("click", () => {
                    zipInput.value = item.zip_code;
                    cityInput.value = item.city;
                    stateInput.value = item.state;

                    suggestionsBox.style.display = "none";
                });

                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = "block";
        });

        document.addEventListener("click", function (e) {
            if (!suggestionsBox.contains(e.target) && e.target !== zipInput) {
                suggestionsBox.style.display = "none";
            }
        });

        zipInput.addEventListener("blur", async function () {
            const zip = this.value.trim();

            if (zip.length === 0) return;
            if (zip.length < 5) {
                alert("ZIP Code must be 5 digits.");
                cityInput.value = "";
                stateInput.value = "";
                return;
            }

            const response = await fetch(`/zipcodes/search?q=${zip}`);
            const data = await response.json();

            if (data.length === 0) {
                alert("ZIP Code not found in database.");
                cityInput.value = "";
                stateInput.value = "";
                return;
            }

            cityInput.value = data[0].city;
            stateInput.value = data[0].state;
        });
    </script>

</body>
</html>
