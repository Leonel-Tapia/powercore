<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerCore - Edit User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8 font-sans">

    <div class="max-w-5xl mx-auto">

        <!-- HEADER -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Edit Panel</h1>
                <p class="text-sm text-gray-500 uppercase tracking-widest">
                    Editing Profile: <span class="text-blue-600 font-bold">{{ user.username }}</span>
                </p>
            </div>

            <a href="/users/list"
               class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded text-xs font-bold transition-all">
                BACK TO USER LIST
            </a>
        </div>

        <form action="/users/update/{{ user.id }}" method="POST">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

                <!-- LEFT SIDE -->
                <div class="md:col-span-2 space-y-6">

                    <!-- PERSONAL INFORMATION -->
                    <div class="bg-white shadow-sm rounded-lg border border-gray-200 p-6">
                        <h3 class="text-xs font-bold text-blue-600 uppercase mb-6 border-b pb-2">Personal Information</h3>

                        <div class="grid grid-cols-1 gap-4">

                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase">Full Name</label>
                                <input type="text" name="full_name" value="{{ user.full_name }}" required
                                       class="w-full border-b border-gray-300 py-2 focus:border-blue-500 outline-none text-slate-800 font-medium">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase">Email</label>
                                    <input type="email" name="email" value="{{ user.email }}" required
                                           class="w-full border-b border-gray-300 py-2 focus:border-blue-500 outline-none">
                                </div>

                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase">Username (Locked)</label>
                                    <input type="text" value="{{ user.username }}" readonly
                                           class="w-full border-b border-transparent py-2 text-gray-400 cursor-not-allowed italic">
                                </div>
                            </div>

                        </div>

                        <!-- LOCATION & CONTACT -->
                        <h3 class="text-xs font-bold text-blue-600 uppercase mt-8 mb-6 border-b pb-2">Location & Contact</h3>

                        <div class="space-y-4">

                            <input type="text" name="address" placeholder="Address" value="{{ user.address or '' }}"
                                   class="w-full border-b border-gray-300 py-1 focus:border-blue-500 outline-none">

                            <div class="grid grid-cols-3 gap-4">
                                <input type="text" name="city" placeholder="City" value="{{ user.city or '' }}"
                                       class="border-b border-gray-300 py-1 focus:border-blue-500 outline-none">

                                <input type="text" name="state" placeholder="State" value="{{ user.state or '' }}"
                                       class="border-b border-gray-300 py-1 focus:border-blue-500 outline-none">

                                <input type="text" name="postal_code" placeholder="Postal Code" value="{{ user.postal_code or '' }}"
                                       class="border-b border-gray-300 py-1 focus:border-blue-500 outline-none">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase">Phone 1</label>
                                    <input type="text" name="phone_1" value="{{ user.phone_1 or '' }}"
                                           class="w-full border-b border-gray-300 py-1 focus:border-blue-500 outline-none">
                                </div>

                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase">Phone 2</label>
                                    <input type="text" name="phone_2" value="{{ user.phone_2 or '' }}"
                                           class="w-full border-b border-gray-300 py-1 focus:border-blue-500 outline-none">
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- RIGHT SIDE -->
                <div class="space-y-6">

                    <!-- SYSTEM ACCESS -->
                    <div class="bg-slate-800 rounded-lg p-6 text-white shadow-lg">
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">System Access</h3>

                        <div class="space-y-4">

                            <div>
                                <label class="block text-[9px] text-slate-500 uppercase mb-1">Role</label>
                                <select name="role"
                                        class="w-full bg-slate-700 border-none rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">

                                    <!-- ROLES EN INGLÉS ORDEN ALFABÉTICO -->
                                    <option value="ACCOUNTING" {% if user.role == 'ACCOUNTING' %}selected{% endif %}>ACCOUNTING</option>
                                    <option value="ADMIN" {% if user.role == 'ADMIN' %}selected{% endif %}>ADMIN</option>
                                    <option value="AUDITOR" {% if user.role == 'AUDITOR' %}selected{% endif %}>AUDITOR</option>
                                    <option value="HR" {% if user.role == 'HR' %}selected{% endif %}>HR</option>
                                    <option value="MANAGER" {% if user.role == 'MANAGER' %}selected{% endif %}>MANAGER</option>
                                    <option value="PURCHASING" {% if user.role == 'PURCHASING' %}selected{% endif %}>PURCHASING</option>
                                    <option value="SALES" {% if user.role == 'SALES' %}selected{% endif %}>SALES</option>
                                    <option value="SUPPORT" {% if user.role == 'SUPPORT' %}selected{% endif %}>SUPPORT</option>
                                    <option value="USER" {% if user.role == 'USER' %}selected{% endif %}>USER</option>
                                    <option value="WAREHOUSE" {% if user.role == 'WAREHOUSE' %}selected{% endif %}>WAREHOUSE</option>

                                </select>
                            </div>

                            <div>
                                <label class="block text-[9px] text-slate-500 uppercase mb-1">Status</label>
                                <select name="is_active"
                                        class="w-full bg-slate-700 border-none rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="true" {% if user.is_active %}selected{% endif %}>ACTIVE / ENABLED</option>
                                    <option value="false" {% if not user.is_active %}selected{% endif %}>INACTIVE / DISABLED</option>
                                </select>
                            </div>

                        </div>
                    </div>

                    <!-- EMPLOYMENT DETAILS -->
                    <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
                        <h3 class="text-xs font-bold text-slate-700 uppercase mb-4 border-b pb-2">Employment Details</h3>

                        <div class="space-y-4">

                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase">Position</label>
                                <input type="text" name="position" value="{{ user.position or '' }}"
                                       class="w-full border-b border-gray-300 py-1 focus:border-blue-500 outline-none text-sm">
                            </div>

                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase">Salary</label>
                                <input type="number" step="0.01" name="salary" value="{{ user.salary or 0.00 }}"
                                       class="w-full border-b border-gray-300 py-1 focus:border-blue-500 outline-none text-sm font-mono text-green-700">
                            </div>

                        </div>
                    </div>

                    <!-- CHANGE PASSWORD -->
                    <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
                        <label class="block text-[10px] font-bold text-red-500 uppercase">Change Password</label>
                        <input type="password" name="password" placeholder="Leave blank to keep current password"
                               class="w-full border-b border-gray-300 py-1 focus:border-red-500 outline-none text-sm italic">
                    </div>

                    <!-- SAVE BUTTON -->
                    <button type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-xl transition-all transform hover:scale-[1.02] uppercase text-xs tracking-widest">
                        Save Changes
                    </button>

                    <!-- CANCEL -->
                    <div class="text-center pt-2">
                        <a href="/users/list" class="text-[10px] text-gray-400 hover:text-blue-600 italic">
                            ← Cancel and return to list
                        </a>
                    </div>

                </div>
            </div>
        </form>

    </div>

</body>
</html>
