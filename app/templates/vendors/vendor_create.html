<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Vendor - PowerCore ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { border-radius: 4px; border: none; }
        .card-header { border-bottom: 2px solid #0078D4; }
        .form-label { font-size: 0.75rem; font-weight: 700; color: #555; text-transform: uppercase; margin-bottom: 3px; }
        .form-control-sm { border-radius: 4px; border: 1px solid #ccc; font-size: 0.9rem; }
        .section-title { font-size: 0.8rem; font-weight: 700; color: #0078D4; border-bottom: 1px solid #ddd; margin: 15px 0 10px 0; padding-bottom: 3px; text-transform: uppercase; }
        .btn-success { background-color: #107c10; border: none; }
        .btn-success:hover { background-color: #0b5e0b; }
    </style>
</head>
<body>

    <div class="container-fluid mt-3" style="max-width: 1000px;">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                <h5 class="mb-0 fw-bold text-primary">Register New Vendor</h5>
                <div class="d-flex align-items-center gap-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="is_active_toggle" checked>
                        <label class="form-check-label small fw-bold" for="is_active_toggle">Active Status</label>
                    </div>
                </div>
            </div>
            
            <div class="card-body p-4">
                <form action="/vendors/create" method="POST" id="vendorForm">
                    <input type="hidden" name="status_active" id="status_active" value="true">

                    <div class="section-title mt-0">General Information</div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Vendor Code *</label>
                            <input type="text" name="vendor_code" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Vendor Name *</label>
                            <input type="text" name="vendor_name" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-sm">
                        </div>
                    </div>

                    <!-- PAYMENT TERMS + TERMS DAYS -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Payment Terms</label>
                            <input type="text" name="payment_terms" class="form-control form-control-sm" placeholder="Net 30, 7 días, etc.">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Terms Days</label>
                            <input type="number" name="terms_days" class="form-control form-control-sm" min="0" readonly placeholder="Auto">
                        </div>
                    </div>

                    <div class="section-title">Contact & Communication</div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Primary Contact</label>
                            <input type="text" name="contact_name" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Contact Title</label>
                            <input type="text" name="contact_title" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control form-control-sm phone-mask">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Mobile</label>
                            <input type="text" name="mobile" class="form-control form-control-sm phone-mask">
                        </div>
                    </div>

                    <div class="section-title">Location / Address</div>
                    <div class="row g-2 mb-4">
                        <div class="col-md-5">
                            <label class="form-label">Street Address</label>
                            <input type="text" name="address" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">City</label>
                            <input type="text" name="city" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">State / Prov.</label>
                            <input type="text" name="state" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Zip Code</label>
                            <input type="text" name="zip_code" class="form-control form-control-sm">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/vendors/list" class="btn btn-secondary btn-sm px-4">Cancel</a>
                        <button type="submit" class="btn btn-success btn-sm px-5 fw-bold">Save Vendor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Phone formatting
        document.querySelectorAll('.phone-mask').forEach(input => {
            input.addEventListener('input', e => {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
                e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
            });
        });

        // Sync toggle with hidden input
        document.getElementById('vendorForm').addEventListener('submit', function() {
            document.getElementById('status_active').value = document.getElementById('is_active_toggle').checked;
        });
    </script>
</body>
</html>
